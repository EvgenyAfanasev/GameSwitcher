name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Sync electrobun devkit
        run: bunx electrobun sync

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun test

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Sync electrobun devkit
        run: bunx electrobun sync

      - name: Build Windows bundle
        run: bunx electrobun build --env=stable

      - name: List build output
        run: Get-ChildItem -Recurse build | Select-Object -ExpandProperty FullName

      - uses: actions/upload-artifact@v4
        with:
          name: gameswitcher-windows-x64
          path: build/
          if-no-files-found: error
